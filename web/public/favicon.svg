<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- ===== 底板：琥珀玻璃 ===== -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F3C07C"/>
      <stop offset="0.38" stop-color="#E29142"/>
      <stop offset="0.78" stop-color="#B96A24"/>
      <stop offset="1" stop-color="#96511A"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFF3D8" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#FFCE8A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF9C40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#3D1C00" stop-opacity="0"/>
      <stop offset="1" stop-color="#3D1C00" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ===== 日历卡：玻璃纸面 ===== -->
    <linearGradient id="card" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.99"/>
      <stop offset="0.6" stop-color="#F2F5FA" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#DFE6F0" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA851"/>
      <stop offset="0.5" stop-color="#F97D18"/>
      <stop offset="1" stop-color="#E05E06"/>
    </linearGradient>
    <linearGradient id="headerSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A3D04"/>
      <stop offset="0.35" stop-color="#C96A14"/>
      <stop offset="0.6" stop-color="#E8934A"/>
      <stop offset="1" stop-color="#8F4206"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cellYuan" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFC173"/>
      <stop offset="0.55" stop-color="#FB8A25"/>
      <stop offset="1" stop-color="#E96D08"/>
    </radialGradient>

    <!-- ===== 安全帽：3D 玻璃釉面 ===== -->
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A6"/>
      <stop offset="0.32" stop-color="#FFD84E"/>
      <stop offset="0.72" stop-color="#F5B415"/>
      <stop offset="1" stop-color="#D89003"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE070"/>
      <stop offset="0.55" stop-color="#F7BC1F"/>
      <stop offset="1" stop-color="#D19204"/>
    </linearGradient>
    <radialGradient id="domeSpec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="ao" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <filter id="softAo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 玻璃底板 -->
  <!-- ============================================================ -->
  <rect x="28" y="28" width="968" height="968" rx="218" fill="url(#tile)"/>
  <rect x="28" y="28" width="968" height="968" rx="218" fill="url(#tileGlow)"/>
  <rect x="28" y="28" width="968" height="968" rx="218" fill="url(#tileShade)"/>
  <!-- 顶部整体光泽（玻璃反光带） -->
  <path d="M246 28 h532 a218 218 0 0 1 218 218 v96 c-306 96 -662 96 -968 0 v-96 a218 218 0 0 1 218 -218 z"
        fill="url(#tileSheen)"/>
  <!-- 内亮边 + 外暗边（玻璃厚度） -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7"/>
  <rect x="33" y="33" width="958" height="958" rx="213" fill="none" stroke="#5E3208" stroke-opacity="0.35" stroke-width="5"/>

  <!-- ============================================================ -->
  <!-- 日历卡（3D 悬浮 + 纸页堆叠） -->
  <!-- ============================================================ -->
  <!-- 落影 -->
  <ellipse cx="470" cy="756" rx="286" ry="44" fill="#4A2400" opacity="0.42" filter="url(#ao)"/>
  <!-- 纸页堆叠（厚度） -->
  <rect x="272" y="648" width="420" height="60" rx="38" fill="#96A2B2"/>
  <rect x="258" y="626" width="448" height="66" rx="42" fill="#B2BDCB"/>
  <rect x="244" y="604" width="476" height="72" rx="46" fill="#CCD5E0"/>
  <!-- 卡体 -->
  <g>
    <rect x="232" y="204" width="500" height="440" rx="54" fill="url(#card)"/>
    <!-- 顶栏 -->
    <path d="M232 258 a54 54 0 0 1 54 -54 h392 a54 54 0 0 1 54 54 v78 H232 Z" fill="url(#header)"/>
    <path d="M232 258 a54 54 0 0 1 54 -54 h392 a54 54 0 0 1 54 54 v30 c-112 30 -388 30 -500 0 z" fill="url(#headerSheen)"/>
    <!-- 挂环（3D 圆柱） -->
    <rect x="348" y="150" width="46" height="118" rx="23" fill="url(#ring)"/>
    <rect x="356" y="156" width="18" height="70" rx="9" fill="#FFC98F" opacity="0.85"/>
    <rect x="594" y="150" width="46" height="118" rx="23" fill="url(#ring)"/>
    <rect x="602" y="156" width="18" height="70" rx="9" fill="#FFC98F" opacity="0.85"/>
    <!-- 记工格子：勾选 + 工钱 -->
    <g>
      <rect x="290" y="372" width="88" height="88" rx="24" fill="url(#cellYuan)"/>
      <path d="M313 416 l18 20 l32 -40" stroke="#FFFFFF" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="438" y="372" width="88" height="88" rx="24" fill="#3A4A66" opacity="0.12"/>
      <rect x="586" y="372" width="88" height="88" rx="24" fill="url(#cellYuan)"/>
      <!-- ¥ 用路径绘制，避免字体依赖 -->
      <g stroke="#FFFFFF" stroke-width="13" fill="none" stroke-linecap="round">
        <path d="M612 396 l18 28 M648 396 l-18 28"/>
        <path d="M614 438 h32 M614 454 h32"/>
      </g>
      <rect x="290" y="484" width="88" height="88" rx="24" fill="#3A4A66" opacity="0.12"/>
      <rect x="438" y="484" width="88" height="88" rx="24" fill="url(#cellYuan)"/>
      <path d="M461 528 l18 20 l32 -40" stroke="#FFFFFF" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="586" y="484" width="88" height="88" rx="24" fill="#3A4A66" opacity="0.12"/>
    </g>
    <!-- 卡面斜向玻璃高光 -->
    <path d="M560 204 h118 a54 54 0 0 1 54 54 v96 c-120 -40 -172 -86 -226 -150 z" fill="url(#streak)" opacity="0.5"/>
    <path d="M232 292 c150 34 350 34 500 0 v20 c-150 34 -350 34 -500 0 z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- ============================================================ -->
  <!-- 安全帽（3D 釉面主体） -->
  <!-- ============================================================ -->
  <ellipse cx="706" cy="816" rx="256" ry="40" fill="#3D1D00" opacity="0.5" filter="url(#ao)"/>
  <g>
    <!-- 帽檐两层（厚度） -->
    <ellipse cx="706" cy="760" rx="246" ry="58" fill="#A87104"/>
    <ellipse cx="706" cy="744" rx="242" ry="56" fill="url(#brim)"/>
    <!-- 帽体 -->
    <path d="M504 738 C 514 566 596 464 706 464 C 816 464 898 566 908 738 Z" fill="url(#dome)"/>
    <!-- 帽脊 -->
    <path d="M706 458 c 21 0 35 82 35 196 h-70 c0 -114 14 -196 35 -196 z" fill="#FFF4C9"/>
    <path d="M678 466 c-7 34 -10 78 -10 122 h-13 c0 -50 7 -94 23 -122 z" fill="#E8A80A" opacity="0.55"/>
    <!-- 帽体左侧大高光（釉面） -->
    <ellipse cx="626" cy="600" rx="72" ry="102" fill="url(#domeSpec)" transform="rotate(-16 626 600)"/>
    <!-- 帽脊旁镜面小高光 -->
    <ellipse cx="654" cy="516" rx="26" ry="42" fill="#FFFFFF" opacity="0.8" filter="url(#softAo)" transform="rotate(-18 654 516)"/>
    <!-- 帽体右侧环境反光 -->
    <path d="M872 596 C 890 640 900 688 903 738 L 872 738 C 868 690 860 642 850 604 Z" fill="#FFF6D0" opacity="0.55"/>
    <!-- 帽檐前缘高光 -->
    <ellipse cx="706" cy="738" rx="196" ry="24" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="706" cy="732" rx="140" ry="15" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
