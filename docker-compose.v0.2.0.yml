# 部署文件（随发行产物分发）
# 本文件由发行脚本复制到 release/<版本>/ 目录，镜像版本号自动替换为当前版本。
#
# 用法：
#   cd release/<版本>
#   docker compose up -d
#
# 镜像说明：
#   - 本机已构建：make build-docker 生成 techfunways/worklog:<版本>
#   - 远程部署：需先将对应版本镜像推送到镜像仓库后再拉取
#
# 升级方式：
#   切换到新版本发行目录后执行 docker compose up -d；
#   数据（SQLite/上传文件/日志/配置）持久化在 named volume 中，升级不丢数据。
services:
  techfunway-worklog:
    image: techfunways/worklog:v0.2.0
    container_name: techfunway-worklog
    ports:
      - "8909:8909"
    volumes:
      # 数据库、上传文件、日志和配置均持久化在此卷中。
      - techfunway-worklog-data:/app/data
    environment:
      - ENV=release
      - DATA_DIR=/app/data
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist"]
    restart: unless-stopped

volumes:
  techfunway-worklog-data:
